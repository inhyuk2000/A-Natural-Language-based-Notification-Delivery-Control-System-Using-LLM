name: backend-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set +e
          python -m pytest tests -q --tb=line > pytest-out.txt 2>&1
          code=$?
          cat pytest-out.txt
          if [ "$code" -ne 0 ]; then
            python -c "from pathlib import Path; text=Path('pytest-out.txt').read_text(encoding='utf-8', errors='replace').strip().replace(chr(10), ' | '); print('::error::' + text[-700:])"
          fi
          exit $code

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for secrets
        run: python backend/scripts/secret_scan.py
